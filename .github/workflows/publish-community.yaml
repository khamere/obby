# Releases of the community-fixes line. Every release is created as a draft
# and published by hand from the Releases page. Runs only for a tag named
# v<version>-cf<a>.<b>.<c>, where <version> is the version in package.json
# and a.b.c is the community release on top of it, and publishes to this
# repository's releases and container registry. Upstream's publish.yaml stays
# untouched so merges from upstream apply cleanly. The tag also matches
# upstream's v*.*.* trigger, so that workflow must stay disabled here.
name: "Community release"

on:
  push:
    tags:
      - "v*-cf*"

jobs:
  collect-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      current_version: ${{ steps.package-version.outputs.version }}
      release: ${{ steps.package-version.outputs.release }}
      label: ${{ steps.package-version.outputs.label }}
      version_code: ${{ steps.package-version.outputs.version_code }}
      tag_name: ${{ github.ref_name }}
      name: Obby ${{ steps.package-version.outputs.label }}
      release_body: ${{ steps.release-notes.outputs.release_body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CF="${GITHUB_REF_NAME#v${VERSION}-cf}"
          if [ "$GITHUB_REF_NAME" = "$CF" ] || ! [[ "$CF" =~ ^(0|[1-9][0-9]?)\.(0|[1-9])\.(0|[1-9])$ ]]; then
            echo "Tag $GITHUB_REF_NAME must be v${VERSION}-cf<a>.<b>.<c> for package.json version $VERSION (a up to 99, b and c up to 9)"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          IFS='.' read -r A B C <<< "$CF"
          # Android needs one rising integer below 2.1 billion; upstream's own
          # scheme leaves no room for a community part, so we spread it out.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=cf$CF" >> "$GITHUB_OUTPUT"
          echo "label=$VERSION-cf$CF" >> "$GITHUB_OUTPUT"
          echo "version_code=$((MAJOR * 100000000 + MINOR * 1000000 + PATCH * 10000 + A * 100 + B * 10 + C))" >> "$GITHUB_OUTPUT"

      - name: Generate release notes since the previous community release
        id: release-notes
        run: |
          PREV_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.draft == false and .tag_name != \"$GITHUB_REF_NAME\" and (.tag_name | test(\"-cf[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\")))] | .[0].tag_name // empty")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -X POST \
              -f tag_name="$GITHUB_REF_NAME" \
              -f previous_tag_name="$PREV_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              --jq '.body')
          else
            NOTES="First community release"
          fi
          FULL_BODY=$(printf '%s\n\n%s' \
            "Community build of Obby. Desktop apps do not update themselves; download the next release from here." \
            "$NOTES")
          echo "release_body<<__BODY__" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$FULL_BODY" >> "$GITHUB_OUTPUT"
          echo "__BODY__" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The desktop apps carry upstream's updater, which would offer upstream's
  # builds as updates. We point the updater at this repository instead, where
  # no update manifest exists, so the check finds nothing.
  publish-tauri:
    needs: collect-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the files people install go to the release, by explicit
          # list: the build also leaves updater archives and the macOS .app
          # behind, which serve a self-update this build does not do.
          - platform: "macos-15" # Apple silicon
            args: "--target aarch64-apple-darwin --bundles dmg"
            files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: "macos-15" # Intel
            args: "--target x86_64-apple-darwin --bundles dmg"
            files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: "ubuntu-22.04" # glibc 2.35 compatibility
            args: "--bundles deb,rpm,appimage"
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: "windows-latest"
            args: "--bundles nsis,msi"
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 16.4 (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm install

      - name: Point the updater at this repository
        shell: bash
        run: |
          cat > community-updater.json <<JSON
          {"plugins":{"updater":{"endpoints":["https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"]}}}
          JSON

      # Without a tag the action only builds; the upload below picks the files.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBBY_RELEASE: ${{ needs.collect-version.outputs.release }}
          OBBY_RELEASES_REPO: ${{ github.repository }}
        with:
          args: ${{ matrix.args }} --config community-updater.json

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body: ${{ needs.collect-version.outputs.release_body }}
          name: ${{ needs.collect-version.outputs.name }}
          tag_name: ${{ needs.collect-version.outputs.tag_name }}
          files: ${{ matrix.files }}

  # Needs the ANDROID_RELEASE_KEYSTORE, ANDROID_RELEASE_KEY and
  # ANDROID_RELEASE_PASSWORD secrets; see docs/community-releases.md.
  publish-android:
    runs-on: ubuntu-latest
    needs: collect-version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "zulu"
          java-version: "22"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager "ndk;27.0.11902837"

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "android-builds"

      - name: Install dependencies
        run: npm install

      - name: Build app bundle
        run: |
          npm run tauri android build -- --apk --config "{\"bundle\":{\"android\":{\"versionCode\":${{ needs.collect-version.outputs.version_code }}}}}"
        env:
          OBBY_RELEASE: ${{ needs.collect-version.outputs.release }}
          OBBY_RELEASES_REPO: ${{ github.repository }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837

      - name: Extract the signing key
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE }}" | base64 -d > src-tauri/gen/android/release.jks

      - name: Sign the APK
        run: |
          OUT=src-tauri/gen/android/app/build/outputs
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" sign \
            --ks src-tauri/gen/android/release.jks \
            --ks-key-alias "${{ secrets.ANDROID_RELEASE_KEY }}" \
            --ks-pass "pass:${{ secrets.ANDROID_RELEASE_PASSWORD }}" \
            --out "$OUT/apk/universal/release/Obby-${{ needs.collect-version.outputs.label }}.apk" \
            "$OUT/apk/universal/release/app-universal-release-unsigned.apk"

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body: ${{ needs.collect-version.outputs.release_body }}
          name: ${{ needs.collect-version.outputs.name }}
          tag_name: ${{ needs.collect-version.outputs.tag_name }}
          files: |
            ./src-tauri/gen/android/app/build/outputs/apk/universal/release/Obby-${{ needs.collect-version.outputs.label }}.apk

  publish-web:
    runs-on: ubuntu-latest
    needs: collect-version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          OBBY_RELEASE: ${{ needs.collect-version.outputs.release }}
          OBBY_RELEASES_REPO: ${{ github.repository }}
        run: |
          npm run build
          zip -r Obby-${{ needs.collect-version.outputs.label }}-web.zip ./dist

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body: ${{ needs.collect-version.outputs.release_body }}
          name: ${{ needs.collect-version.outputs.name }}
          tag_name: ${{ needs.collect-version.outputs.tag_name }}
          files: |
            ./Obby-${{ needs.collect-version.outputs.label }}-web.zip

  # The same image the Dockerfile builds locally, published as
  # ghcr.io/<owner>/obby:<version>-cf<a>.<b>.<c> and :latest.
  publish-docker:
    runs-on: ubuntu-latest
    needs: collect-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and commit
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            OBBY_COMMIT=${{ steps.image.outputs.commit }}
            OBBY_RELEASE=${{ needs.collect-version.outputs.release }}
            OBBY_RELEASES_REPO=${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.collect-version.outputs.label }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
